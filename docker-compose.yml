services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdlc_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sdlc_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdlc_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./apps/ai-service
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  api:
    build:
      context: ./apps/api/SdlcAi.Api
    environment:
      AiService__BaseUrl: http://ai-service:8000
      ConnectionStrings__SdlcAi: Host=postgres;Port=5432;Database=sdlc_ai;Username=postgres;Password=postgres
      GitHub__Token: ${GITHUB_TOKEN:-}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sdlc_ai_data:
