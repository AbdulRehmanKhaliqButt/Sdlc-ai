services:
  ai-service:
    build:
      context: ./apps/ai-service
    ports:
      - "8000:8000"

  api:
    build:
      context: ./apps/api/SdlcAi.Api
    environment:
      AiService__BaseUrl: http://ai-service:8000
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      - ai-service

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
